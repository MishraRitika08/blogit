{% extends 'base.html' %}

{% block content %}

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <!-- AI Blog Generation Form -->
                    <div class="banner mb-4 p-4 rounded bg-light d-flex flex-column align-items-center justify-content-center text-center">
                        <h2 class="mb-2">Create a Blog</h2>

                        <form method="POST" class="w-100 shadow-sm p-3" action="{% url 'blog:generate_blog' %}">
                            {% csrf_token %}

                            <textarea name="topic" id="topic"
                                placeholder="Describe the blog you want AI to write..."
                                class="form-control" rows="2" required>{{ topic|default:"" }}</textarea>

                            <button type="submit" class="btn btn-primary mt-3 mx-auto d-block">
                                Generate Blog with AI
                            </button>
                        </form>
                    </div>

                    <!-- Publish Blog Form -->
                    <form method="POST" enctype="multipart/form-data" action="{% url 'blog:create_blog' %}" class="shadow-sm p-4 rounded bg-light">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="title" class="form-label">Blog Title</label>

                            <input type="text" class="form-control" id="title" name="title"
                                placeholder="Enter your blog title"
                                value="{{ title|default:'' }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="image" class="form-label">Blog Image</label>

                            <input type="file" class="form-control" id="image" name="image" accept="image/*">
                        </div>

                        <div class="mb-3">
                            <label for="content" class="form-label">Blog Content</label>

                            <textarea class="form-control" id="content" name="content" rows="10"
                                placeholder="Write your blog here..." required>{{ content|default:'' }}</textarea>
                        </div>

                        {% if available_tags %}
                        <div class="mb-3">
                            <label class="form-label">Select Tags</label>

                            <div class="d-flex flex-wrap gap-2">
                                {% for tag in available_tags %}
                                <label class="tag-option">
                                    <input type="checkbox" name="tags" value="{{ tag.id }}" class="d-none">

                                    <span class="badge rounded-pill bg-light text-dark border p-2">
                                        {{ tag.name }}
                                    </span>
                                </label>
                                {% endfor %}
                            </div>
                        </div>
                        {% endif %}

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'blog:dashboard' %}" class="btn btn-outline-secondary">
                                Cancel
                            </a>

                            <button type="submit" class="btn btn-primary px-4">
                                Publish Blog
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
