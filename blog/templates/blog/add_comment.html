{% extends 'base.html' %}
{% load markdown_filter %}

{% block content %}
<p>{{ post.title }}</p>

<p>{{ post.content|render_markdown|safe }}</p>
<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label for="content" class="form-label">
            Comment Content:
        </label>
        <textarea class="form-control" rows="2" id="content" name="content" rows="10" placeholder="Write your comment here..."
            required></textarea>
    </div>
    <div class="d-flex justify-content-between">
        <a href="{% url 'blog:blog_detail' %}" class="btn btn-outline-secondary">
            Cancel adding comment
        </a>

        <button type="submit" class="btn btn-primary px-4">
            Publish comment
        </button>
    </div>

</form>
{% endblock %}
