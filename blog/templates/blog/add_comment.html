{% extends 'base.html' %}

{% block content %}
    <p>{{ post.title }}</p>

    <p>{{ post.content }}</p>
     <form method="POST">
        {% csrf_token %}
                        <div class="mb-3">
                            <label for="content" class="form-label">
                                Comment Content
                            </label>
                            <textarea
                                class="form-control"
                                id="content"
                                name="content"
                                rows="10"
                                placeholder="Write your comment here..."
                                required
                            ></textarea>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'blog:dashboard' %}"
                               class="btn btn-outline-secondary">
                                Cancel adding comment
                            </a>

                            <button type="submit"
                                    class="btn btn-primary px-4">
                                Publish comment
                            </button>
                        </div>

                    </form>
{% endblock %}
