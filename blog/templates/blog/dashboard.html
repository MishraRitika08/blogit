{% extends 'base.html' %}

{% block content %}
    <h1>Dashboard</h1>
    <p>Welcome to the dashboard!<strong> {{ user.username|title }}  </strong></p>

    {% for blog in blogs %}
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">{{ blog.title }}</h5>
                <p class="card-text">{{ blog.content|truncatewords:20 }}</p>
                <a href="{% url 'blog:blog_detail' blog.id %}" class="btn btn-primary">View</a>
                <a href="{% url 'blog:blog_update' blog.id %}" class="btn btn-secondary">Edit</a>
                <form method="POST" action="{% url 'blog:blog_delete' blog.id %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </div>
        </div>
    {% empty %}
        <p>No blogs available.</p>
    {% endfor %}
    
</body>
</html>
{% endblock %}
