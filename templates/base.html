<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Base</title>
    <style>
.custom-toast {
    width: 350px;
    background: #f2ffd7;
    border: none;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    margin-bottom: 12px;

    animation: slideIn 0.5s ease forwards;
}

.toast-content {
    display: flex;
    align-items: center;
    padding: 16px;
    gap: 12px;
}

.success-icon {
    width: 38px;
    height: 38px;
    background: #aaff00;
    color: #4000ff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
    animation: popIn 0.4s ease;
}

.toast-text {
    flex: 1;
}

.toast-text strong {
    color: #05070b;
    font-size: 15px;
}

.toast-text p {
    margin: 3px 0 0;
    color: #4a4a53;
    font-size: 13px;
}

.toast-progress {
    height: 4px;
    background: #0D6EFD;
    width: 100%;
    animation: progress 3.5s linear forwards;
}

@keyframes slideIn {
    from {
        transform: translateX(120%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

@keyframes popIn {
    0% {
        transform: scale(0);
    }
    70% {
        transform: scale(1.2);
    }
    100% {
        transform: scale(1);
    }
}

@keyframes progress {
    from { width: 100%; }
    to { width: 0%; }
}

.tag-option {
    cursor: pointer;
}

.tag-option input:checked + span {
    background-color: #0d6efd !important;
    color: white !important;
    border-color: #0d6efd !important;
}
.blog-content {
    line-height: 1.8;
    font-size: 1.1rem;
}

.blog-content h1,
.blog-content h2,
.blog-content h3 {
    margin-top: 1.5rem;
    margin-bottom: 1rem;
}

.blog-content p {
    margin-bottom: 1rem;
}

.blog-content ul,
.blog-content ol {
    padding-left: 2rem;
}

.blog-content pre {
    background: #f8f9fa;
    padding: 1rem;
    border-radius: 8px;
    overflow-x: auto;
}
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <!-- Brand -->
        <a class="navbar-brand fw-bolder" href="{% url 'blog:home' %}">
            BlogIt.
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler" 
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Links -->
        <div class="collapse navbar-collapse" id="navbarContent">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'blog:home' %}">Home</a>
                </li>

                {% if user.is_authenticated %}

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'blog:dashboard' %}">Dashboard</a>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'blog:create_blog' %}">Create Blog</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'users:logout' %}">Logout</a>
                    </li>

                {% else %}

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'users:login' %}">Login</a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-primary ms-lg-2" href="{% url 'users:register' %}">
                            Get Started
                        </a>
                    </li>

                {% endif %}

            </ul>
        </div>
    </div>
</nav>
<main class="container my-5">
{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3"
     style="z-index: 1100;">

    {% for message in messages %}
    <div class="toast custom-toast show"
         role="alert"
         aria-live="assertive"
         aria-atomic="true">

        <div class="toast-content">
            <div class="success-icon">
                <span>✓</span>
            </div>

            <div class="toast-text">
                <strong>Success!</strong>
                <p>{{ message }}</p>
            </div>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="toast">
            </button>
        </div>

        <div class="toast-progress"></div>
    </div>
    {% endfor %}

</div>
{% endif %}

    {% block content %}
    {% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
     document.addEventListener('DOMContentLoaded', function () {
        const toastElements = document.querySelectorAll('.toast');

        toastElements.forEach(function (toastElement) {
            const toast = new bootstrap.Toast(toastElement, {
                delay: 5000,
                autohide: true
            });

            toast.show();
        });
    });
</script>
</body>
</html>
